server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smart-healthcare-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_healthcare_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:${MYSQL_USER:root}}
    password: ${DB_PASSWORD:${MYSQL_PWD:${SPRING_DATASOURCE_PASSWORD:}}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

ml:
  service:
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:8001}

logging:
  level:
    root: INFO
    com.smarthealth.platform: INFO
    org.hibernate.SQL: WARN
